[project]
name = "source-stream-backend"
version = "0.1.0"
description = "Backend for source-stream RAG application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "langchain>=0.2.5",
    "langchain-core>=0.2.9",
    "langchain-community>=0.2.5",
    "langchain-groq>=0.1.5",
    "google-generativeai>=0.7.0",
    "qdrant-client>=1.9.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.32",
    "langchain-google-genai>=4.2.7",
    "langchain-qdrant>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
