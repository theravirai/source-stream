name: Backend CI/CD

on:
  # push:
  workflow_dispatch:  
    # branches:
    #   - main
    # paths:
    #   - 'backend/**'
    #   - '.github/workflows/backend-cicd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/requirements.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Run tests
        run: |
          # Use python module execution to preserve PYTHONPATH
          uv run pytest

  deploy:
    name: Deploy to Cloud Run
    needs: test
    # Only deploy on manual workflow_dispatch
    if: (github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    # Required for Workload Identity Federation authentication
    permissions:
      contents: 'read'
      id-token: 'write'

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy source-stream-backend \
          --source . \
          --region europe-west1 \
          --project project-808fa43c-5d5b-483f-ae8 \
          --quiet
